name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:prepare
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "Refusing to replace assets in a published release."
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" .release-artifacts/*.tgz .release-artifacts/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" .release-artifacts/*.tgz .release-artifacts/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --draft
          fi
