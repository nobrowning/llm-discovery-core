name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 22, arch: x64 }
          - { os: ubuntu-24.04, node: 24, arch: x64 }
          - { os: ubuntu-24.04-arm, node: 24, arch: arm64 }
          - { os: windows-2022, node: 24, arch: x64 }
          - { os: macos-15, node: 24, arch: arm64 }
          - { os: macos-15-intel, node: 24, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Confirm native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1); console.log(process.platform, process.arch, process.version)"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:prepare
